# Pre-commit hooks for USearchMolecules.
# Install once with `pre-commit install`, then hooks run on every `git commit`.
# Run across the whole tree with `pre-commit run --all-files`.

# Jupyter notebooks carry their own JSON formatting and are not linted here.
exclude: '\.ipynb$'
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
