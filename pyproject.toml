[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "wheel"]

[project]
authors = [{name = "Ash Vardanian", email = "ash.vardanian@unum.cloud"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
description = "Large Multi-Modal Chem-Informatics dataset of 7B+ molecules with fingerprints and 3D conformers for drug discovery"
keywords = [
  "molecules",
  "chemistry",
  "drug-discovery",
  "fingerprints",
  "conformers",
  "similarity-search",
  "usearch",
]
license = {text = "Apache-2.0"}
name = "usearchmolecules"
readme = "README.md"
requires-python = ">=3.12"
version = "2.0.0"

# Minimal dependencies for consuming the dataset (searching, loading)
dependencies = [
  "usearch>=2",
  "stringzilla>=5",
  "numkong>=7.4.5",
  "numpy>=2.1",
  "pyarrow>=25",
  "tqdm>=4",
]

# Development dependencies for augmenting/building the dataset
[project.optional-dependencies]
dev = [
  "rdkit>=2025.03", # Molecule processing and fingerprinting
  "jpype1>=1.4", # Chemistry Development Kit (CDK) bindings
  "numba>=0.62", # JIT compilation for performance
  "pytest>=8",
  "pytest-cov",
  "ruff>=0.14",
  "mypy>=1.0",
  "pre-commit>=4",
]

# Visualization via StreamLit GUI
viz = [
  "streamlit>=1.37",
]

# All optional dependencies combined
all = ["usearchmolecules[dev,viz]"]

[project.urls]
"AWS Open Data" = "https://registry.opendata.aws/usearch-molecules/"
"Bug Tracker" = "https://github.com/unum-science/USearchMolecules/issues"
Documentation = "https://github.com/unum-science/USearchMolecules#readme"
Homepage = "https://github.com/unum-science/USearchMolecules"
"Hugging Face" = "https://huggingface.co/datasets/unum-cloud/USearchMolecules"
Repository = "https://github.com/unum-science/USearchMolecules"

[tool.setuptools.packages.find]
exclude = ["tests*", "stats*"]
include = ["usearchmolecules*"]
where = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Curated beyond the default `E,F`: the rule groups that surfaced real issues here.
# B = bugbear, C4 = comprehensions, SIM = simplify, UP = pyupgrade, RET = returns,
# PIE = misc lint, PLW = pylint warnings, RUF = ruff-native, I = import sorting.
select = ["E", "F", "W", "I", "B", "C4", "SIM", "UP", "RET", "PIE", "PLW", "RUF"]
# `×`, `—`, and curly quotes in docstrings are deliberate house style, not typos.
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts print and build results imperatively; magic values and prints are fine.
"stats/*.py" = ["PLR2004"]
"test.py" = ["PLR2004"]

[tool.mypy]
disallow_untyped_defs = false
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

# Pixi configuration for conda-based dependencies
[tool.pixi.workspace]
channels = ["conda-forge", "nvidia"]
name = "usearchmolecules"
platforms = ["linux-64"]

# Pinned RDKit and nvMolKit builds: RDKit for fingerprinting, nvMolKit for GPU conformer generation.
[tool.pixi.dependencies]
cuda-version = "12.9.*"
nvmolkit = "0.4.*"
python = "3.12.*"
rdkit = "2025.03.*"

[tool.pixi.pypi-dependencies]
usearchmolecules = {path = ".", editable = true}

[tool.pixi.tasks]
conformers = {cmd = "python -m usearchmolecules.prep_conformers", depends-on = []}
viz = {cmd = "streamlit run streamlit_app.py", depends-on = []}
